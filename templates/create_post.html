{% extends "base.html" %}

{% block title %}Новый пост{% endblock %}

{% block content %}
<h2>Новый пост</h2>
<form method="post" action="/posts">
    <p>
        <label>Заголовок:</label>
        <input type="text" name="title" required>
    </p>
    <p>
        <label>Текст:</label>
        <textarea name="content" required></textarea>
    </p>
    <button type="submit">Опубликовать</button>
</form>

{% endblock %}
