{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<h2>Регистрация</h2>
<form method="post">
    <p>
        <label>Email:</label>
        <input type="email" name="email" required>
    </p>
    <p>
        <label>Логин:</label>
        <input type="text" name="login" required>
    </p>
    <p>
        <label>Пароль:</label>
        <input type="password" name="password" required>
    </p>
    <button type="submit">Зарегистрироваться</button>
</form>
{% endblock %}
